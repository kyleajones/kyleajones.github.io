<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NFL Weekly Picks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NFL Weekly Pick 7</h1>
        <p>Pick 7 spreads/totals each week to win it all!</p>
        
        <div class="pick-counter-wrap" id="pick-counter-wrap">
            <span class="pick-counter-label">Picks Made: <span id="pick-counter">0/7</span></span>
            <div class="pick-progress-track">
                <div class="pick-progress-bar" id="pick-progress-bar"></div>
            </div>
        </div>

        <nav class="site-tabs">
            <a href="index.html" class="tab active">Picks</a>
            <a href="current-week.html" class="tab">Results</a>
            <a href="record.html" class="tab">Leaders</a>
            <a href="#" id="how-to-play-link" class="tab">Rules</a>
        </nav>
    </header>

    <main>
        <form id="picks-form">
            <div id="auth-container">
                <div id="logged-out-view">
                    <h3 style="margin: 0 0 10px 0; font-size: 1.1em; text-align: center;">Account</h3>

                    <input type="email" id="email-input" class="auth-input" placeholder="Email">
                    <input type="password" id="password-input" class="auth-input" placeholder="Password">
                    <input type="text" id="display-name-input" class="auth-input" placeholder="Name (New Signups)">

                    <div class="auth-actions">
                        <button id="login-btn" type="button" class="btn-primary">Log In</button>
                        <button id="signup-btn" type="button" class="btn-primary">Sign Up</button>
                    </div>

                    <button type="button" id="forgot-password-btn" class="text-link-btn">Forgot password?</button>

                    <div id="auth-error" style="color: var(--color-loss); margin-top: 10px; font-weight: bold; font-size: 0.85em; text-align: center;"></div>
                </div>

                <div id="logged-in-view" style="display: none; text-align: center;">
                    <h3 style="margin: 0 0 10px 0; font-size: 1em; color: var(--color-win);">Hello, <span id="user-display-name"></span></h3>
                    <button id="logout-btn" type="button" class="btn-secondary" style="width: 100%;">Log Out</button>
                </div>
            </div>
            <div class="lock-select-wrap">
                <label for="lock-select">Lock of the Week (+2 bonus if it wins):</label>
                <select id="lock-select" name="lock">
                    <option value="">No Lock</option>
                </select>
            </div>
            <button type="submit" id="submit-picks-btn" disabled>Save Picks</button>
            <div id="matchups-container">
                <!-- Matchups will be populated here by JavaScript -->
            </div>
        </form>
    </main>

    <!-- The "How to Play" modal is injected by ui.js's
         initHowToPlayModal(), so its markup and the rules copy live in one
         place instead of being pasted into all three pages. -->

    <!-- Loaded as an independent module with no external imports, so matchups
         still render even if a content blocker prevents auth.js's Firebase
         imports from loading. -->
    <script type="module" src="matchups.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
