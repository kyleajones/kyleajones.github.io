<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Results</h1>
        <p>Scores &amp; Picks as the Week Plays Out</p>

        <nav class="site-tabs">
            <a href="index.html" class="tab">Picks</a>
            <a href="current-week.html" class="tab active">Results</a>
            <a href="record.html" class="tab">Leaders</a>
            <a href="#" id="how-to-play-link" class="tab">Rules</a>
        </nav>
    </header>

    <main>
        <div class="week-select-wrap">
            <label for="week-select">Week:</label>
            <select id="week-select"></select>
        </div>

        <div id="week-banner">
            <div style="text-align: center; padding: 40px; color: var(--color-text-muted);">Loading games...</div>
        </div>

        <div id="picks-table-container">
            <!-- Player picks table will be automatically injected here by JavaScript -->
        </div>
    </main>

    <!-- "How to Play" modal injected by ui.js's initHowToPlayModal(). -->
    <script type="module" src="current-week.js"></script>
</body>
</html>
