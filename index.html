<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Weekly Picks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NFL Weekly Pick 'Em</h1>
        <p>Select the winner for each matchup</p>
    </header>

    <main>
        <form id="picks-form">
            <div id="matchups-container">
                <!-- Matchups will be populated here by JavaScript -->
            </div>
            <button type="submit" id="submit-btn">Save My Picks</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
