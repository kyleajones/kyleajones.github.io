<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Weekly Picks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NFL Weekly Pick 'Em</h1>
        <p>Select the winner for each matchup</p>
        
        <div style="font-size: 1.2em; font-weight: bold; margin-top: 15px; margin-bottom: 20px;">
            Picks Made: <span id="pick-counter">0</span>
        </div>

        <nav class="site-tabs">
            <a href="index.html" class="tab active">Make Picks</a>
            <a href="record.html" class="tab">Results</a>
            <!-- You can easily add more tabs here later -->
        </nav>
    </header>

    <main>
        <form id="picks-form">
        	<div id="auth-container" style="position: absolute; top: 15px; right: 20px; width: 220px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000;">
				<div id="logged-out-view">
					<h3 style="margin: 0 0 10px 0; font-size: 1.1em; text-align: center;">Account</h3>
					
					<!-- Inputs with 100% width and box-sizing to prevent overflow -->
					<input type="email" id="email-input" placeholder="Email" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
					<input type="password" id="password-input" placeholder="Password" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
					<input type="text" id="display-name-input" placeholder="Name (New Signups)" style="width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
			
					<!-- Flexbox to arrange login and signup buttons side-by-side -->
					<div style="display: flex; gap: 8px;">
						<button id="login-btn" type="button" style="flex: 1; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em;">Log In</button>
						<button id="signup-btn" type="button" style="flex: 1; padding: 8px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em;">Sign Up</button>
					</div>
					
					<div id="auth-error" style="color: #d9534f; margin-top: 10px; font-weight: bold; font-size: 0.85em; text-align: center;"></div>
				</div>
			
				<div id="logged-in-view" style="display: none; text-align: center;">
					<h3 style="margin: 0 0 10px 0; font-size: 1em; color: #28a745;">Hello, <span id="user-display-name"></span></h3>
					<button id="logout-btn" type="button" style="width: 100%; padding: 8px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Log Out</button>
				</div>
			</div>
			<button type="submit" id="submit-picks-btn" disabled>Save Picks</button>	
            <div id="matchups-container">
                <!-- Matchups will be populated here by JavaScript -->
            </div>
        </form>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
