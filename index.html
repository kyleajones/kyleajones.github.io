<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3woks</title>
    <style>
        :root {
            --color-bg-page: #0a0e14;
            --color-bg-card: #161b22;
            --color-bg-elevated: #1e2530;
            --color-border: #2a323d;
            --color-text-main: #e8ecf1;
            --color-text-muted: #8b96a3;
            --color-accent: #ff6a3d;
            --color-accent-hover: #ff8259;
            --radius-lg: 14px;
            --radius-md: 8px;
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.55);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(160deg, #0a0e14 0%, #0d1420 100%);
            color: var(--color-text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .landing-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            padding: 50px 60px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        h1 {
            color: var(--color-text-main);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .tagline {
            color: var(--color-text-muted);
            margin-top: 0;
            margin-bottom: 30px;
        }

        .enter-button {
            display: inline-block;
            background-color: var(--color-accent);
            color: #ffffff;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            border-radius: var(--radius-md);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .enter-button:hover {
            background-color: var(--color-accent-hover);
            box-shadow: 0 0 20px rgba(255, 106, 61, 0.4);
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <h1>3woks</h1>
        <p class="tagline">NFL Pick'em League</p>
        <!-- This relative link points directly to your moved folder -->
        <a href="/pick-em/" class="enter-button">Enter NFL Pick'em</a>
    </div>

</body>
</html>
