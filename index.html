<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Weekly Picks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NFL Weekly Pick 'Em</h1>
        <p>Select the winner for each matchup</p>
        
        <div style="font-size: 1.2em; font-weight: bold; margin-top: 15px; margin-bottom: 20px;">
            Picks Made: <span id="pick-counter">0/7</span>
        </div>

        <nav class="site-tabs">
            <a href="index.html" class="tab active">Make Picks</a>
            <a href="record.html" class="tab">My Record</a>
            <!-- You can easily add more tabs here later -->
        </nav>
    </header>

    <main>
        <form id="picks-form">
            <div id="matchups-container">
                <!-- Matchups will be populated here by JavaScript -->
            </div>
            <button type="submit" id="submit-btn">Save My Picks</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
