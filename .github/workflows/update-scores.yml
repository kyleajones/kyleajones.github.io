name: Fetch NFL Scores and Update Leaderboard

on:
  schedule:
    # 7 minutes after the matchups workflow, to preserve today's relative
    # ordering in case a dependency between them ever reappears. Not on
    # the hour or half-hour, since GitHub Actions deprioritizes schedules
    # that land on those popular marks under load.
    - cron: '30 7 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests firebase-admin

      - name: Run Scores Fetcher Script
        working-directory: ./pick-em
        run: python fetch_scores.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pick-em/results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NFL scores" && git pull --rebase origin main && git push)

      - name: Update Leaderboard Aggregate
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        working-directory: ./pick-em
        run: python update_leaderboard.py

      - name: Update Weekly Picks Board
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        working-directory: ./pick-em
        run: python update_weekly_picks.py
