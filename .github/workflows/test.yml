name: Pick 'Em Tests

on:
  pull_request:
    paths: ['pick-em/**']
  push:
    branches: [main]
    paths: ['pick-em/**']

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r tests/requirements.txt
        working-directory: pick-em
      - run: pytest
        working-directory: pick-em

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: pick-em/tests/rules
      - run: npx firebase emulators:exec --project=demo-pickem "node --test *.test.js"
        working-directory: pick-em/tests/rules
